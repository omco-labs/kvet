name: Test / Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to the v0.35.0 commit SHA, not the tag: in March 2026 an attacker force-pushed
      # 76 of 77 trivy-action tags to inject a credential stealer (CVE-2026-33634). v0.35.0 was
      # protected by GitHub's immutable-releases feature and was not affected. Mutable tags
      # (including @v0) can be silently re-pointed, so pin by SHA and bump deliberately.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: 1
