# DISABLED: this workflow previously ran kvet in API mode against the Anthropic
# API (ANTHROPIC_API_KEY). Under kvet's model policy, non-agentic (API) mode only
# supports localhost OpenAI-compatible providers, which are unreachable on GitHub
# runners, so PR triggers have been removed. Use kvet-agentic.yml instead (it
# requires the Kiro CLI on the runner). This workflow can only be run manually.
name: Kvet

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  kvet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          build-from-source: true
