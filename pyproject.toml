[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvet"
version = "0.2.0"
description = "Kiro-only LLM-based code review tool that finds issues tests and linters miss (standalone fork of imbue-ai/vet)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
keywords = ["code-review", "llm", "verification", "linting", "ai", "git", "diff"]
authors = [
    { name = "Imbue" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Original vet (upstream) dependencies
    "jinja2",
    "loguru",
    "pydantic>=2.11.4",

    # From imbue_core
    "anyio",
    "attrs",
    "cachetools",
    "cattrs",
    "diskcache>=5.6.3",
    "httpx",
    "pathspec",
    "pygit2>=1.18.0",
    "pyhumps",
    "tblib==2.0.0",
    "toml",
    "typeid-python",
    "yasoo",
    "anthropic~=0.54",
    "openai>=1.79.0",
    "tiktoken",
    "google-genai>=1.26.0",

    # From imbue_tools
    "async_lru",
    "libcst",
]

[project.urls]
Homepage = "https://github.com/omco-labs/kvet"
Repository = "https://github.com/omco-labs/kvet"
Issues = "https://github.com/omco-labs/kvet/issues"

[project.scripts]
kvet = "kvet.cli.main:main"

[tool.setuptools]
package-data.kvet = ["py.typed"]

[tool.setuptools.packages.find]
include = ["kvet*"]

[dependency-groups]
dev = [
    "black",
    "isort",
    "pytest",
    "ruff",
    "syrupy",
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120
force_single_line = true
case_sensitive = true
order_by_type = false
known_first_party = ["kvet"]
no_lines_before = ["future"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Import sorting (I) is handled by isort, not ruff, so it's left out of select.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length: black enforces this for code; long comments/strings are pre-existing
    "E731",  # lambda assignment: used intentionally for local closures in the LLM API layer
]

[tool.ruff.lint.per-file-ignores]
# Trailing whitespace here is meaningful unified-diff test fixture data, not a formatting slip.
"kvet/repo_utils_test.py" = ["W293"]
