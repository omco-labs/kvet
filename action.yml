name: "Kvet"
description: "Kiro-only LLM-based code review that finds issues tests and linters miss"
author: "omco-labs (fork of Imbue's vet)"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  agentic:
    description: "Enable agentic mode (uses the Kiro CLI, which must be available on the runner). Default: true. Non-agentic (API) mode requires a localhost OpenAI-compatible model server, which is generally unreachable on CI runners."
    required: false
    default: "true"
  model:
    description: "LLM model to use"
    required: false
    default: ""
  confidence-threshold:
    description: "Minimum confidence for reported issues (0.0-1.0)"
    required: false
    default: ""
  max-workers:
    description: "Maximum number of parallel workers"
    required: false
    default: ""
  max-spend:
    description: "Maximum API spend in dollars"
    required: false
    default: ""
  temperature:
    description: "Model temperature (0.0-2.0)"
    required: false
    default: ""
  enabled-issue-codes:
    description: "Space-separated list of issue codes to enable"
    required: false
    default: ""
  disabled-issue-codes:
    description: "Space-separated list of issue codes to disable"
    required: false
    default: ""
  config:
    description: "Named config preset from .kvet/configs.toml"
    required: false
    default: ""
  extra-context:
    description: "Space-separated paths to extra context files"
    required: false
    default: ""
  fail-on-issues:
    description: "Fail the workflow when kvet finds issues"
    required: false
    default: "false"
  build-from-source:
    description: "Build and install kvet from the checked-out source tree instead of the GitHub repository (kvet is not published on PyPI)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # NOTE: Agentic mode requires the Kiro CLI (`kiro-cli`) to be installed and
    # authenticated on the runner; this action does not install it.

    - name: Install kvet
      shell: bash
      run: |
        # kvet is not published on PyPI; install from source or from this repository.
        if [[ "${{ inputs.build-from-source }}" == "true" ]]; then
          pip install .
        else
          pip install "git+https://github.com/omco-labs/kvet.git@main"
        fi

    - name: Run kvet
      if: github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_AGENTIC: ${{ inputs.agentic }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        INPUT_MAX_WORKERS: ${{ inputs.max-workers }}
        INPUT_MAX_SPEND: ${{ inputs.max-spend }}
        INPUT_TEMPERATURE: ${{ inputs.temperature }}
        INPUT_ENABLED_ISSUE_CODES: ${{ inputs.enabled-issue-codes }}
        INPUT_DISABLED_ISSUE_CODES: ${{ inputs.disabled-issue-codes }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXTRA_CONTEXT: ${{ inputs.extra-context }}
        INPUT_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
        INPUT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        INPUT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_GOAL: |
          ${{ github.event.pull_request.title }}

          Additional context (not necessarily part of the goal):
          ${{ github.event.pull_request.body }}
      run: python "${{ github.action_path }}/action/run.py"
